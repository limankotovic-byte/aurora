  <!-- Optional distortion of the duplicated backdrop under hovered tiles.
       Only the decorative lens layer is distorted, not content or controls. -->
  <svg class="glass-filter-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <filter id="liman-water-refraction" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.026" numOctaves="2" seed="8" result="ripple" />
        <feDisplacementMap in="SourceGraphic" in2="ripple" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>
