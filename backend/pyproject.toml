[project]
name = "aurora-backend"
version = "0.1.0"
description = "Provider-independent API for the Aurora Android anime client"
requires-python = "==3.13.*"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2,<3",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright[nodejs]>=1.1,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
